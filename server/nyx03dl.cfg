# nyx03dl.cfg — put this file next to nyx03dl.dll (or in the server
# directory). Lines starting with # are comments. Missing file = all
# defaults (port 8777, default base pool).

# HTTP port for /nyx03dl/manifest, /nyx03dl/file/<nama>,
# /nyx03dl/players (default 8777).
nyx_http_port=8777

# Base ped pool: comma-separated ped ids (0-311) the plugin may assign
# automatically as the base model of a custom skin. Id 0 (CJ) is never
# used even if listed. Default pool is ped ids 264-293 (30 slots).
nyx_base_pool=264,265,266,267,268,269,270,271,272,273,274,275,276,277,278,279,280,281,282,283,284,285,286,287,288,289,290,291,292,293
